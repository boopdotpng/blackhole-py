SRCB_CLR = "the unpackers do not own a SrcB bank to fill"
SRCA_VLD = "math does not own a SrcA bank to read"
SRCB_VLD = "math does not own a SrcB bank to read"
XMOV = "the mover is busy"
TRISC_CFG = "a RISC MMIO write to the config is pending"
SFPU = "the SFPU is busy"
CFGEXU = "the configuration unit is busy"

[enum.SemWait]
