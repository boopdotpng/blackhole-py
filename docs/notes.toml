# Descriptions for docs/index.html (built by docs/build.py). Structure comes from hw/*.py; text from here.

[about]
notes = [
  "(probed) = measured on a p150 (the Tensix ones by the cfgprobe runs of 2026-11-23); the rest is from tt-isa-documentation or what ttrv kernels do every day. UNCERTAIN: marks what neither settles.",
  "Tensix words are shown unrotated; a TRISC instruction stream stores each one rotated left by 2 (isa.inline / isa.outline).",
  "Field layouts are tt-llk's. Several fields are wider than the bits the hardware reads (a Dst row is 10 bits, a Src row 6, an address-modifier slot 3); the field descriptions give the real widths.",
]

[groups]
control = []
config = ["A config write is not visible to the instruction immediately after it. Put one unrelated instruction (NOP) between a WRCFG / CFGSHIFTMASK and its consumer, and keep ttrv's two NOPs between a WRCFG of unpacker config and the UNPACR."]
scalar = ["Each thread has 64 32-bit Tensix GPRs (MMIO at 0xFFE00000). These instructions compute in them, so a value such as an L1 address can be stepped and written to config (WRCFG) without the RISC.", "They take 3 or 4 cycles. On Blackhole they do not hold back the thread's other units: STALLWAIT on Wait.THCON before another unit reads the result."]
ADC = ["Each thread has three sets of address counters (ADCs): unpacker 0, unpacker 1 and the packer, picked by the counters field (isa.Adc: 1 unpacker 0, 2 unpacker 1, 4 packer). A set has two channels of X, Y, Z, W counters, each with a carry/reset copy (CR).", "Channel 0 addresses the input (L1 for an unpacker, Dst for the packer) and channel 1 the output (Src or Dst for an unpacker, L1 for the packer). X on channel 0 is the first datum and X on channel 1 the last datum, inclusive, of the range an instruction moves: for an unpacker datums of the L1 tile, for the packer columns of each Dst row.", "Nothing checks these counters. Three settings give wrong data with no error (probed): a packer channel-0 Y that is not a multiple of 4 packs fewer rows, a packer channel-1 X past 15 wraps mod 16 and shrinks every row, and an unpacker channel-1 X past x_dim - 1 reads on into the next tile and overwrites the start of Src."]
"unpack/pack" = []
FPU = ["An 8-row Dst block an arithmetic instruction wrote cannot be read back by the FPU for 5 cycles (hardware stalls), so loop over at least 6 distinct blocks. The packer and the SFPU do not get that stall: STALLWAIT on Wait.MATH before PACR or SFPLOAD touches rows the FPU has just written.", "A Dst row operand is added to cfg.THREAD.dst_offset and the Dst RWC. release frees Src banks to the unpackers once the instruction is done. addr_mod names one of the 8 slots of cfg.ADDR_MOD, whose increments are applied to the SrcA / SrcB / Dst RWCs and the fidelity phase afterwards; slot 0 is kept all-zero."]
SFPU = ["An LReg holds 32 lanes of 32 bits: 4 rows of 8, covering the even or the odd columns of 4 consecutive Dst rows. Register operands (a, b, c, src, dest, lreg) take isa.LReg numbers. Results are written only to L0..L7, and only in enabled lanes: a lane is enabled unless predication is on (SFPENCC) and its condition flag is clear.", "A destination of 12..15 does not execute the instruction: it records the instruction word as SFPLOADMACRO template (destination - 12) instead. SFPCONFIG and SFPLOADMACRO are the exceptions.", "One instruction per cycle. Only the MAD column (SFPMAD, SFPMUL, SFPADD, SFPMULI, SFPADDI, SFPMUL24, SFPLUT, SFPLUTFP32) has 2-cycle latency; SFPSWAP (all modes) and SFPSHFT2 (modes 2, 3, 4) hold the issue slot an extra cycle (the hardware stalls the next non-SFPNOP SFPU op).", "The hardware stalls most RAW hazards after a 2-cycle producer; the ones it misses are listed on each instruction. WAW needs nothing: the later write wins. Measured on Blackhole A0 card 1 across 46 producers x 70 consumers (boop-docs/probes/model.py).", "Register usage lines name operands by position: VD [7:4] (dest), VC [11:8] (src / c), VB [15:12] (b), VA [19:16] (a), mod [3:0] (mode); R is the [23:20] register (lreg) of SFPLOAD, SFPLOADI, SFPSTORE, SFPLUT, SFPLOADMACRO. \"stall logic sees\" = what the hardware waits on; a read it does not see is an undetected hazard."]

[cfg_blocks]
_ = "T = ThreadConfig: per Tensix thread, words 0..67, written whole-word with SETC16; boot zeroes every word. C = Config: shared by the threads, two banks, written with RMWCIB (masked byte), WRCFG, or MMIO at TENSIX_CFG = 0xFFEF0000 (4 bytes per word). Index letters: s = slot, i = unpacker 0/1, c = context."
THREAD = "Per-thread control registers (ThreadConfig)."
ADDR_MOD = "The 8 math address-modifier slots (THREAD.addr_mod[s], alias cfg.ADDR_MOD). Each slot also has a third word (AB2, 20 + s) that only holds the +64 bit of each Src increment. It matters only when both Src banks are merged into one 128-row bank, which nothing here does, so it stays 0 from boot."
PACK_ADDR_MOD = "The 4 packer address-modifier slots (THREAD.pack_addr_mod[s], alias cfg.PACK_ADDR_MOD)."
MATH = "Shared FPU / SFPU formats, Dst accumulation width, and the ReLU the packer applies."
UNPACK = "UNPACK[0] feeds SrcA (or Dst directly), UNPACK[1] SrcB. The unpacker THCON sections start at words 64 and 112. Unpacker 1 has 2 contexts (UNPACK_B_CONTEXTS), and contexts 2..7 on it hang the card. The per-context formats, base and offset apply per UNPACR with no reconfiguration (measured, contexts 0, 1, 2 and 5). row_stride and face_stride are not per context, so contexts in one stream must produce the same Src datum width: BF16 alternating with BFP8 comes out wrong for one, with no error. A context kept for unpack-to-Dst needs 4-byte strides and THREAD.srca_override_addr=0. Two combinations hang the unpacker: plain data with zero-decompression enabled, and BFP8 in L1 into a FLOAT16_B Src."
PACK = "One packer (Dst -> L1, driven by TRISC2). A datum goes Dst -> in_fmt -> ReLU (MATH) -> edge mask -> downsample -> out_fmt -> L1 (optionally added to L1). PACK.ctx[c] blocks start at words 68, 96, 116, 144 (THCON_SEC0_REG1, SEC0_REG8, SEC1_REG1, SEC1_REG8). The four contexts can stay programmed at once and be chosen per PACR (measured for all four in one stream); the Dst strides are not per context, so contexts in one stream need in_fmts of the same width. ttrv uses context 0 only."
GLOBAL = "Global Tensix settings. GLOBAL words survive MATH.state_reset."
MOVER = "The mover XMOV starts: an asynchronous L1 copy or zero-fill in 16-byte units."

[[baby_riscv]]
what = "Which core runs what"
fact = "Every core (BRISC, NCRISC, TRISC0-2): RV32IM, Zba, Zbb, pack/brev8/grevi, Zaamo, the F and Zfh subsets, ebreak (pauses the core for the debugger). BRISC and NCRISC only: mret. TRISC2 only: the V subset; on the other cores vsetvli still returns a VL, but the first vector load, ALU op or store hangs the core until tt-smi -r. From tt-isa-documentation BabyRISCV/InstructionSet.md and a probe on a p150a (2026-11-14) that ran on every core."
[[baby_riscv]]
what = "Missing instructions"
fact = "Unimplemented encodings are UndefinedBehavior, not a trap: fdiv, fsqrt, lr.w/sc.w, Zbs, Zbc, packh/zip/unzip, and in RVV vdiv/vdivu/vrem/vremu, vfdiv/vfrdiv, vfsqrt, vfrsqrt7, vfrec7. ecall is RV32I, but nothing handles the trap."
[[baby_riscv]]
what = "Floating point"
fact = "rm (rounding mode) is encoded but ignored: always round to nearest even (fcvt.w.s 3.75 with rtz gives 4). fcsr exists; fflags and frm do not. Arithmetic and fused ops treat denormal inputs as zero and flush denormal results (probed). fmadd/fmsub/fnmsub/fnmadd are not IEEE fused: rounding sits between separate mul+add and a true FMA."
[[baby_riscv]]
what = "cfg0 (CSR 0x7C0)"
fact = "Bit 30 makes the Zfh (.h) arithmetic BF16 instead of FP16 (bit 31: RTNE, else RTZ). fcvt.s.h/fcvt.h.s still convert as FP16 in that mode (0x3FC0 -> 0x77C00000, probed), so convert bf16 <-> f32 with a 16-bit shift; the vector vfwcvt.f.f.v does follow the mode, and RVV FP ops at SEW=16 follow it too."
[[baby_riscv]]
what = "Zaamo atomics"
fact = "Local L1 only, not MMIO and not other tiles (use NoC atomics for those). The hardware ignores aq/rl and always runs them as aq+rl. No lr.w/sc.w. Probed: amoadd.w, amoswap.w, amoor.w, amomaxu.w."
[[baby_riscv]]
what = "Counters"
fact = "cycle and instret are CSRs 0xC00 and 0xC02 (csrrs rd, csr, x0); time is not implemented."
[[baby_riscv]]
what = "RVV on TRISC2"
fact = "VLEN = 128 bits, ELEN = 32: SEW is 8, 16 or 32; a vsetvli with e64 hung TRISC2. ta/ma are ignored (always undisturbed); there is no vill bit. Most ops carry a false dependency on vd, fractional LMUL behaves like LMUL>1, and LMUL>1 is split into micro-ops (camel-cdr's rvv-bench). Copying 4 KiB of L1 with vle32/vse32 at m8 took 1298 cycles against 3349 for an 8x-unrolled lw/sw loop; summing 1024 words, 1372 against 4092."
[[baby_riscv]]
what = "What hw/isa.py encodes"
fact = "RV32IM only (plus fence). The extensions above (Zba, Zbb, Zbkb/grevi, Zaamo, F, Zfh, RVV) are not used by codegen, so their encoders were removed."


[tensix.NOP]
group = "control"
desc = "Tensix no-op. Does nothing. It is the filler for unused MOP template slots (the MOP expander skips a slot holding exactly this word) and the spacer after a config write whose next instruction would consume it. It is not a wait: use STALLWAIT to order units."

[tensix.MOP]
group = "control"
desc = "Expand a macro-op template. The thread's MOP expander turns this one word into a looped sequence of instructions taken from the 9 MOP_CFG words (MMIO at 0xFFB80000, written by the RISC; `isa.MOP_CFG_WORDS`, in order outer, inner, start, end0, end1, loop0, loop1, last_inner, last)."
notes = """
Template 1, words (outer, inner, start, end0, end1, loop0, loop1, last_inner, last): repeat outer times { start; inner times { loop0; loop1 }; end0; end1 }, where the very last loop instruction of each outer pass is replaced by last_inner, and by last on the final pass. A slot holding NOP is skipped. loop1 present doubles the inner instruction count. Counts are 10 bits.

Template 0, words (-, flags, b, a0, a1, a2, a3, skip_a, skip_b): for i in 0..loop_count, if bit i of the 32-bit mask is clear emit a0 (then a1..a3 with flags bit 1) then b (with flags bit 0); if set emit skip_a then skip_b. The mask is MOP_CFG's 16 bits above this word's 16.

Wait for a load from 0xFFE80008 (returns once the expander is idle) before rewriting the template words. A template-1 MOP whose start slot is NOP with an inner count of 0 hits a hardware bug."""
[tensix.MOP.fields]
template = "Template: 0 mask-driven, 1 nested loop."
loop_count = "Template 0: iterations minus 1."
mask_lo = "Template 0: low 16 bits of the skip mask. Template 1: keep 0."

[tensix.MOP_CFG]
group = "control"
desc = "Set the high half of the MOP skip mask. Stores bits 31:16 of the mask the next template-0 MOPs use. It is per thread and stays until changed."
[tensix.MOP_CFG.fields]
mask_hi = "The 16 mask bits (only 16 are read)."

[tensix.REPLAY]
group = "control"
desc = "Record or replay instructions. Each thread has a 32-word replay buffer."
notes = "Repetition comes from a MOP or a software loop around the replay, not from this instruction."
[tensix.REPLAY.fields]
start = "First buffer slot."
length = "Number of instructions to record or replay."
execute = "With record=1: 1 also executes the instructions as they are recorded, 0 only stores."
record = "1 records the next len Tensix words into the buffer. 0 replays len stored words once."

[tensix.STALLWAIT]
group = "control"
desc = "Hold back instruction classes until conditions clear."
notes = "The thread keeps issuing instructions until it reaches one in a held class, so this orders units without stopping the others. It is the only reliable ordering between units: NOPs are not."
[tensix.STALLWAIT.fields]
stall = "isa.Stall mask: which classes of this thread's later instructions wait."
wait = "isa.Wait mask: what they wait for. All selected conditions must clear."

[tensix.SEMINIT]
group = "control"
desc = "Initialise semaphores."
[tensix.SEMINIT.fields]
max = "Maximum value (4 bits)."
init = "Initial value (4 bits)."
sems = "Semaphore mask, 1 << number, for the 8 semaphores."

[tensix.SEMPOST]
group = "control"
desc = "Increment semaphores."
[tensix.SEMPOST.fields]
sems = "Semaphore mask, 1 << number. Does not block."

[tensix.SEMGET]
group = "control"
desc = "Decrement semaphores."
[tensix.SEMGET.fields]
sems = "Semaphore mask, 1 << number. Does not block: pair it with SEMWAIT to wait for a value."

[tensix.SEMWAIT]
group = "control"
desc = "Hold back instruction classes on a semaphore."
notes = "It does not change the semaphore."
[tensix.SEMWAIT.fields]
stall = "isa.Stall mask, as STALLWAIT."
sems = "Semaphore mask, 1 << number."
cond = "isa.SemWait: 1 wait while any selected semaphore is 0, 2 wait while any is at its maximum."

[tensix.SETC16]
group = "config"
desc = "Write a ThreadConfig word. Replaces the whole word; ThreadConfig fields are at most 16 bits."
[tensix.SETC16.fields]
word = "ThreadConfig word index (cfg Space.THREAD)."
value = "New value of the word."

[tensix.RMWCIB0]
group = "config"
desc = "Update byte 0 of a Config word. Read-modify-write: only the masked bits change."
notes = "RMWCIB1 / 2 / 3 do the same for bytes 1 / 2 / 3, so a field spanning bytes takes one instruction per byte."
[tensix.RMWCIB0.fields]
mask = "Bits of the byte to change."
data = "Their new values."
word = "Config word index (cfg Space.CONFIG) in this thread's config bank."

[tensix.RMWCIB1]
group = "config"
desc = "Update byte 1 (bits 15:8) of a Config word. Fields as RMWCIB0."
fields_as = "RMWCIB0"

[tensix.RMWCIB2]
group = "config"
desc = "Update byte 2 (bits 23:16) of a Config word. Fields as RMWCIB0."
fields_as = "RMWCIB0"

[tensix.RMWCIB3]
group = "config"
desc = "Update byte 3 (bits 31:24) of a Config word. Fields as RMWCIB0."
fields_as = "RMWCIB0"

[tensix.WRCFG]
group = "config"
desc = "Write a Config word from a Tensix GPR."
notes = "If the GPR was just written by SETDMAREG or ADDDMAREG, put STALLWAIT(Stall.CFG, Wait.THCON) between them: NOPs do not order the scalar unit against the config unit on Blackhole."
[tensix.WRCFG.fields]
gpr = "Source GPR (6 bits)."
wide = "0 writes one 32-bit word. 1 writes four aligned GPRs to four aligned Config words."
word = "Config word index (11 bits)."

[tensix.RDCFG]
group = "config"
desc = "Read a Config word into a Tensix GPR. Cannot read ThreadConfig."
notes = "It sees an RMWCIB or WRCFG the same thread issued just before it, with no STALLWAIT between (probed). The instructions right after must not read the GPR: STALLWAIT on Wait.CFGEXU first."
[tensix.RDCFG.fields]
gpr = "Destination GPR (6 bits)."
word = "Config word index. Only the low 8 bits are used, so words 0..255."

[tensix.CFGSHIFTMASK]
group = "config"
desc = "Combine a scratch word into a Config word. Blackhole only. It modifies a Config word in the instruction stream with no RISC involved and no GPR, so a REPLAY or MOP body can step an address by itself: CFGSHIFTMASK(1, 3, 31, 0, 0, base word) is base += scratch[0]. With M = the low mask_width + 1 bits and r the rotation: word = (old, or old & ~rotr(M, r)) OP rotr(scratch & M, r). All 8 operations, both mask settings and the rotation match that in 96 of 96 random cases (probed)."
notes = "2 cycles. Follow it with a NOP before an instruction that consumes the word. Probed recipe: a 14-instruction REPLAY body (reset Z, STALLWAIT, 4 UNPACR to SrcA, 4 to SrcB, STALLWAIT(Stall.CFG, Wait.UNPACK0), this instruction on the unpacker base, 2 NOPs) read 4 consecutive tiles correctly with no RISC involved."
[tensix.CFGSHIFTMASK.fields]
keep_old = "0 first clears the target bits the mask covers. 1 leaves the old value whole."
operation = "How the value v is combined: 0 |= v, 1 &= v, 2 ^= v, 3 += v, 4 |= ~v, 5 &= ~v, 6 ^= ~v, 7 -= v."
mask_width = "The value is the scratch word's low mask_width + 1 bits..."
rotate = "...rotated right by this many bits (the mask rotates with it)."
scratch = "Which scratch word: 0..2 are cfg.GLOBAL.scratch[0..2] from any thread, 3 is scratch[issuing thread]: word 209 + TRISC number (probed on all three)."
word = "Config word index. Never a scratch word."

[tensix.SETDMAREG]
group = "scalar"
desc = "Set half of a Tensix GPR to an immediate. The other half is kept."
[tensix.SETDMAREG.fields]
imm = "The 16-bit immediate (word bits 23:8)."
signals_mode = "0. (1 is a different instruction form that reads packer state into GPRs.)"
half_reg = "2 * gpr for the low half, 2 * gpr + 1 for the high half."

[tensix.ADDDMAREG]
group = "scalar"
desc = "Add Tensix GPRs. GPR[result] = GPR[a] + (GPR[b] or a 6-bit immediate). tt-llk steps the packer output address with it inside a MOP: ADDDMAREG, STALLWAIT, WRCFG, NOP. The register + register form followed by STALLWAIT(Stall.CFG, Wait.THCON | Wait.UNPACK0) and WRCFG stepped an unpacker base correctly (probed)."
notes = "The sum wraps at 32 bits; both the register and the immediate form are probed."
[tensix.ADDDMAREG.fields]
b_is_imm = "1: b is an unsigned immediate, not a register."
dest = "Result GPR (6 bits)."
b = "Right operand: GPR or immediate."
a = "Left operand GPR."

[tensix.SUBDMAREG]
group = "scalar"
desc = "Subtract Tensix GPRs. GPR[result] = GPR[a] - (GPR[b] or a 6-bit immediate), wrapping at 32 bits (probed, both forms). Fields as ADDDMAREG."
fields_as = "ADDDMAREG"

[tensix.MULDMAREG]
group = "scalar"
desc = "Multiply Tensix GPRs. GPR[result] = low 16 bits of GPR[a] times low 16 bits of (GPR[b] or a 6-bit immediate), unsigned, 32-bit result (probed). Fields as ADDDMAREG."
fields_as = "ADDDMAREG"

[tensix.SHIFTDMAREG]
group = "scalar"
desc = "Shift a Tensix GPR. GPR[result] = GPR[a] shifted by GPR[b] & 31 or by a 5-bit immediate."
[tensix.SHIFTDMAREG.fields]
b_is_imm = "1: b is the immediate shift amount."
right = "1 logical right. 0 left, and so is every other value tried (2, 3, 4) (probed)."
dest = "Result GPR."
b = "Shift amount: GPR or immediate."
a = "Value GPR."

[tensix.LOADIND]
group = "scalar"
desc = "Load from L1 into a Tensix GPR. Reads at L1 address GPR[addr] * 16 + offset, where the offset is a 16-bit GPR half that can post-increment. It lets a value kept in L1 (a position, an address) reach config without the RISC."
notes = "The GPR is written some cycles after the instruction completes: STALLWAIT on Wait.THCON before using it. Sizes, alignment and the four auto-increments all match this description (probed)."
[tensix.LOADIND.fields]
size = "0 128 bits into the four GPRs at data & ~3, 1 32 bits (address aligned to 4), 2 16 bits, 3 8 bits. 2 and 3 write only the low bits and keep the rest of the GPR: clear it first."
offset_reg = "Half-GPR holding the byte offset (2 * gpr, + 1 for the high half; 7 bits)."
inc = "Add 0, 2, 4 or 16 to the offset afterwards (codes 0..3)."
data_reg = "Destination GPR."
addr_reg = "GPR holding the L1 address in 16-byte units."

[tensix.STOREIND]
group = "scalar"
desc = "Store Tensix GPRs to L1, to MMIO, or into a Src bank. Three forms, chosen by word bits 23:21 (mmio, size, reg_size):"
notes = """
```text
mmio=1                L1: writes at GPR[addr] * 16 + offset. (size, reg_size) picks the size: (0, 0) 128
                            bits from the four GPRs at data & 0x3C, (0, 1) 16 bits, (1, 0) 32 bits, (1, 1) 8 bits.
                            The ISA docs swap the 16-bit and 32-bit codes. Four back-to-back stores all landed
                            exactly. An UNPACR issued right after a store, with no STALLWAIT, reads the new
                            data (300 of 300); one issued before it reads the old data (probed).
mmio=0, size=1     MMIO (reg_size=0): writes the whole GPR at
                            0xFFB00000 + ((GPR[addr] + (offset >> 4)) & 0xFFFFC), so the offset's low 4 bits are
                            ignored (probed). Addresses below 0xFFB11000 are undefined.
mmio=0, size=0     Src: writes 4 BF16 datums, the halves of GPR[data & 0x3C] and the next GPR, into SrcA
                            (reg_size=0) or SrcB (reg_size=1) of the bank the unpacker owns. With
                            a = GPR[addr] + (offset >> 4): columns 4 * (a & 3) .. + 3, row a >> 2 for SrcB and
                            (a >> 2) - 4 for SrcA. Do not use it (probed, SrcA): the row and columns are as
                            stated, but the first of back-to-back stores is dropped and each low-half datum v
                            arrives as (v >> 8) | ((v & 0xFE) << 7). Only the high halves are exact.
```"""
[tensix.STOREIND.fields]
mmio = "Form select (word bit 23), see the forms below."
size = "Form select / size (bit 22)."
reg_size = "Size / Src select (bit 21)."
offset_reg = "Half-GPR holding the 16-bit offset (2 * gpr, + 1 for the high half)."
inc = "Add 0, 2, 4 or 16 to the offset afterwards (codes 0..3), in every form."
data_reg = "Data GPR."
addr_reg = "Address GPR: L1 address in 16-byte units, or the MMIO word offset."

[tensix.LOADREG]
group = "scalar"
desc = "Read an MMIO register into a Tensix GPR. GPR = the 32-bit word at 0xFFB00000 + (addr << 2)."
notes = "The GPR is written later: STALLWAIT on Wait.THCON before using it. A GPR written with STOREREG reads back through this (probed)."
[tensix.LOADREG.fields]
reg = "Destination GPR."
addr = "Word offset from 0xFFB00000. Addresses below 0xFFB11000 are undefined."

[tensix.STOREREG]
group = "scalar"
desc = "Write a Tensix GPR to an MMIO register. The 32-bit word at 0xFFB00000 + (addr << 2) = GPR. This is the pack-done signal: STALLWAIT(Stall.THCON, Wait.PACK0) then STOREREG writes the register only once the packs before it have finished, for example to bump a circular-buffer counter with no RISC waiting for the packer. Without that STALLWAIT the write lands 13..24 cycles earlier, before the pack is done (probed)."
[tensix.STOREREG.fields]
reg = "Source GPR."
addr = "Word offset from 0xFFB00000. Addresses below 0xFFB11000 are undefined."

[tensix.SETADC]
group = "ADC"
desc = "Set one address counter. Sets the counter and its CR copy."
[tensix.SETADC.fields]
counters = "1 unpacker 0, 2 unpacker 1, 4 packer."
channel = "Channel 0 or 1."
dim = "0 X, 1 Y, 2 Z, 3 W."
value = "New value. Use 16 bits: a non-zero value in bits 17:16 redirects the write to another thread's counters, which is unsupported."

[tensix.SETADCXX]
group = "ADC"
desc = "Set both X counters. The datum range the next unpack or pack instructions move."
[tensix.SETADCXX.fields]
counters = "1 unpacker 0, 2 unpacker 1, 4 packer."
x_end = "Channel 1 X: the last datum, count minus 1 (10 bits)."
x_start = "Channel 0 X: the first datum."

[tensix.SETADCXY]
group = "ADC"
desc = "Set X and Y counters. Each selected counter and its CR copy get a 3-bit value."
notes = "Leave channel-1 X alone (no mask bit 2): it is the last datum of the range. Clearing it makes the packer pack 1 datum per row and makes every unpack return garbage, with no error (probed with mask 15). Reset the packer's counters with mask 11 (as ttrv does) and an unpacker's Y counters with mask 10."
[tensix.SETADCXY.fields]
counters = "1 unpacker 0, 2 unpacker 1, 4 packer."
ch1_y = "Channel 1 Y (3 bits)."
ch1_x = "Channel 1 X."
ch0_y = "Channel 0 Y."
ch0_x = "Channel 0 X."
mask = "Which to set: 1 Ch0 X, 2 Ch0 Y, 4 Ch1 X, 8 Ch1 Y."

[tensix.SETADCZW]
group = "ADC"
desc = "Set Z and W counters. As SETADCXY with Z for X and W for Y."
[tensix.SETADCZW.fields]
counters = "1 unpacker 0, 2 unpacker 1, 4 packer."
ch1_w = "Channel 1 W (3 bits)."
ch1_z = "Channel 1 Z."
ch0_w = "Channel 0 W."
ch0_z = "Channel 0 Z."
mask = "Which to set: 1 Ch0 Z, 2 Ch0 W, 4 Ch1 Z, 8 Ch1 W."

[tensix.INCADCXY]
group = "ADC"
desc = "Increment X and Y counters. Adds each 3-bit value to its counter; the CR copies are not touched. Fields as SETADCXY, without a mask (0 leaves a counter alone). A change takes effect at the next new address."
notes = """
Packer (probed): ch1_y += n moves the L1 output by n * l1_y_stride. ch0_x += k shifts the Dst read by k columns. ch0_y is the Dst row a PACR starts at, and a PACR reads from there to the end of its aligned 4-row group, rows Y .. Y | 3. So step ch0_y by 4 only: off a multiple of 4 each PACR reads 3, 2 or 1 rows, the address modifier's +4 keeps the misalignment, and a 16-PACR tile writes 48, 32 or 16 rows and leaves the rest empty.

Unpacker (probed with y_dim=1, x_dim=1024): ch0_y += 1 reads the next tile."""
fields_as = "SETADCXY"

[tensix.INCADCZW]
group = "ADC"
desc = "Increment Z and W counters. Adds each value to its counter; the CR copies are not touched. Fields as SETADCZW, without a mask (0 leaves a counter alone). A change takes effect at the next new address. W has no address-modifier increment, so this (or SETADC) is how W steps."
notes = """
Packer (probed): ch1_z += n moves the L1 output by n * l1_z_stride and ch1_w by n * l1_w_stride. ch0_w += 1 steps the Dst read one tile, ch0_z += 4 steps it 4 faces. So INCADCZW(4, ch1_z=1, ch0_w=1) after a tile's Last PACR moves both the output address and the Dst tile, with one l1_dest_addr write for the whole run: 8 FP32 tiles packed exactly, at 55 cycles a tile as the end op of a template-1 MOP, 66 from a REPLAY, 172 pushed by the RISC.

Unpacker (probed with z_dim 1, 2 and 4): the L1 read position is base + (Z * x_dim * y_dim + W * x_dim * y_dim * z_dim) datums, so ch0_z += 1 steps one face and ch0_w += 1 one whole tile, and the two add. A REPLAY of STALLWAIT, UNPACR, INCADCZW(1, ch0_z=1) read 4 consecutive single-face tiles correctly."""
fields_as = "SETADCZW"

[tensix.ADDRCRXY]
group = "ADC"
desc = "Advance X and Y from their CR copies. For each counter whose mask bit is set: CR += value, then counter = CR. With a value of 0 it restores the counter from its CR copy, undoing INCADCXY steps and address-modifier increments. mask 0 does nothing. Fields as SETADCXY. Probed for all four counters."
notes = """
Packer: ch0_x is the first Dst column read (it accumulates across tiles) and ch1_x the last, inclusive and mod 16. SETADCXX sets ch1_x to 15, so adding k to it leaves k datums per row.

Unpacker: ch0_x is the first L1 datum read and ch1_x the last, inclusive. ch1_x past x_dim - 1 reads into the next tile and wraps into Src row 0.

UNCERTAIN: in one unpacker run that moved ch0_x, the contiguous read broke at datum 256. Not explained."""
fields_as = "SETADCXY"

[tensix.ADDRCRZW]
group = "ADC"
desc = "Advance Z and W from their CR copies. As ADDRCRXY, fields as SETADCZW: for each counter whose mask bit is set, CR += value, then counter = CR; mask 0 does nothing (probed). An INCADCZW followed by ADDRCRZW with value 0 snaps the counter back to its CR. ADDRCRZW(4, ch1_z=1, ch0_w=1, mask=6) as a MOP end op steps the packer's output address and Dst tile like INCADCZW does (probed)."
fields_as = "SETADCZW"

[tensix.UNPACR]
group = "unpack/pack"
desc = "Unpack L1 into Src or Dst. Moves the datum range channel-0 X .. channel-1 X of the selected unpacker's ADC, converting between the configured formats. ttrv issues UNPACR(i, steps, 0, ctx, 0, 1, dvalid, 0, 0, 0, 0, 0, 1)."
notes = """
L1 address read: (base_addr[ctx] + offset_addr[ctx & 3] + 1) * 16, then past a BFP exponent section, plus the datum index (((W * z_dim + Z) * y_dim + Y) * x_dim + X) times the datum size, with X, Y, Z, W the channel-0 counters (low 8 bits of Y, Z, W). There are no input strides. Consecutive tiles without the RISC rewriting the base per tile (all probed):

- Let channel-0 Z keep counting past z_dim and reset only channel-1 Z per tile (SETADCZW mask=4). BF16: 4 tiles in 524 cycles against 708 with a base rewrite per tile. Not for BFP8 stored as [exponents][data] per tile: only tile 0 comes out right.
- Step offset_addr with an RMWCIB pair per tile, with no extra stall. Any format; BFP8: 621 against 708.
- Step base_addr itself inside a REPLAY body with CFGSHIFTMASK.
- Step channel-0 Z with INCADCZW after each tile's UNPACRs, also inside a REPLAY.

Hangs (probed): plain data with the context's disable_zero_compress=0, and BFP8 in L1 into a FLOAT16_B Src. Unpacker 0 writing Dst clobbers its SrcA bank. Before unpacker 0 fills SrcA again after an unpack to Dst, STALLWAIT on Wait.UNPACK0, or Dst rows leak into SrcA."""
[tensix.UNPACR.fields]
unpacker = "0 unpacker 0 (to SrcA, or straight to Dst), 1 unpacker 1 (to SrcB)."
steps = "Counter steps applied afterwards, 2 bits each: bits 1:0 channel 0 Z (input), 3:2 channel 0 Y, 5:4 channel 1 Z (output), 7:6 channel 1 Y. ttrv's 0x11 steps both Zs to the next face."
ctx_inc = "Keep 0. 1 is a different instruction form that only steps the context counter."
ctx = "Config context: which cfg.UNPACK[i] per-context fields apply (0..7; 0..1 for unpacker 1, higher ones hang). Formats and addresses switch per UNPACR with no reconfiguration, but the contexts of one stream must share a Src datum width (probed; see cfg.UnpackerCfg)."
adc_ctx = "Whose ADC supplies X and Y: keep 0 for this thread's."
per_ctx = "1 = use the per-context config. Always 1: the docs call the 0 form unsupported."
set_dvalid = "1 hands the filled bank to math afterwards and switches the unpacker to the other bank. It also records the output format as the format the FPU will use for the bank. Set it on the tile's last UNPACR: it is the only way to hand unpacked data over (UNPACR_NOP's set_dvalid form zero-fills the bank)."
srcb_bcast = "1 fills SrcB row r from L1 row r & ~3, so each group of 4 rows repeats its first row (probed over all 64 rows)."
zero = "1 writes zeros instead of the unpacked data (probed)."
auto_ctx = "1 takes the context from the context counter and steps it. Keep 0: unsupported."
row_search = "Keep 0."
cache_flush = "Keep 0. 1 is a different instruction form."
last = "ttrv and tt-llk pass 1. 0 and 1 give the same data in the same time (probed)."

[tensix.UNPACR_NOP]
group = "unpack/pack"
desc = "Unpacker-ordered control action. Runs in order with that unpacker's UNPACRs. Blackhole's encoding is its own; the Wormhole pages do not apply."
notes = "Two forms are useful: UNPACR_NOP(unpacker=i, mode=2) is an unpacker-ordered no-op between config writes, and UNPACR_NOP(unpacker=i, set_dvalid=1, mode=1) hands math a bank of zeros (of -inf / NaN with fill_neg_inf=1). The second one does not publish what was unpacked: the fill overwrites all 64 rows first (probed). ttrv's unpack.dvalid is this form, and no kernel uses it. To hand over unpacked data, set set_dvalid on the last UNPACR."
[tensix.UNPACR_NOP.fields]
unpacker = "0 unpacker 0, 1 unpacker 1."
stream = "Keep 0 (NoC overlay)."
msg_clear = "Keep 0 (NoC overlay)."
set_dvalid = "1 hands the bank to math afterwards, without resetting the Src row pointer. Only with mode=1, which fills the bank first: with mode 0 or 2 the bank is never handed over and the core hangs, across reloads, until a card reset (probed)."
clear_fmt = "Keep 0."
stall_own_bank = "1 waits on the unpacker's own bank like an UNPACR, 0 on the bank math is using."
bank_clear = "Keep 0 (both banks; races)."
fill_neg_inf = "Fill value for mode 1: 0 zero, 1 negative infinity (SrcA only)."
mode = "Mode: 1 clear Src, 2 do nothing for one unpacker slot. 0 and 3 are NoC overlay actions."

[tensix.PACR]
group = "unpack/pack"
desc = "Pack Dst into L1. Reads up to four 16-datum Dst rows, converts them and appends them to the L1 output. Formats, ReLU, edge masks, strides and the output address come from cfg.PACK."
notes = """
Output address. Only the first PACR after a last (or after reset) computes it; the PACRs after it append. It is (l1_dest_addr + 1) * 16 + Y * l1_y_stride + Z * l1_z_stride + W * l1_w_stride, in bytes, with Y, Z, W the channel-1 counters and the strides multiples of 16 (probed for all three). Self-advance (probed, FP32 / BF16 / BFP8): write l1_dest_addr once, set l1_z_stride to the tile's size in L1, and give the tile's last PACR an address-modifier slot with ydst_clear and zdst_incr=1. Each tile then lands after the one before with no address rewrite, 26..30 cycles a tile cheaper when the PACRs come from a MOP. zdst_clear returns to the base. For the Dst side, either the slot also has ysrc_clear and zsrc_clear and a SETADC sets channel-0 W to the tile index before each tile, or it has ysrc_incr=4 in place of ysrc_clear and the Dst rows keep counting into the next tile with no instruction between tiles. INCADCZW after the last PACR does the same job in one instruction, stepping the output address and the Dst tile together, at 55 cycles a tile from a MOP against 50 for the address-modifier slot plus its SETADC. With converted output, do not change those counters or l1_dest_addr while a tile is being packed.

A non-last PACR can hold its output until the next PACR: a STALLWAIT on Wait.PACK0 after it may never finish. End every sequence with last. A RISC pushing PACRs back to back is stalled until the packer drains, so a pushed loop is bound by the push rate. Do not ZEROACC or SFPSTORE into rows within about 3 instructions after the PACR that reads them."""
[tensix.PACR.fields]
ctx = "Packer config context 0..3 (2 bits): which cfg.PACK.ctx[...] applies (output address, formats, exponent section size, l1_acc, pack counters, Dst offset). All four work in one stream, as long as their in_fmts have the same width (probed; see cfg.PackCtx)."
row_pad = "Zero padding of short rows. Keep 0."
strided = "1 reads Dst rows 8 apart instead of adjacent. Keep 0."
addr_mod = "Packer address-modifier slot (cfg.PACK_ADDR_MOD[0..3]) applied afterwards: steps Y / Z of channel 0 (the Dst rows read) and channel 1 (the L1 output position)."
adc_ctx = "With override_thread: use that thread's ADC (0..2)."
zero = "1 packs zeros instead of reading Dst. With rows=0 it packs channel-1 X + 1 zeros."
rows = "Which of the 4 Dst rows at the current position to read, one bit per row. 0 means all four."
override_thread = "Keep 0."
concat = "Keep 0 (compression)."
ctx_ctrl = "1: take the context from the packer's context counter instead of ctx; the counter steps 0, 1, 2, 3, 0 after each PACR with last. 2: pack nothing and reset that counter (both probed)."
flush = "Keep 0. Undefined on Blackhole once any PACR has run: the packer never goes idle."
last = "1 ends the tile: flushes the output, and makes the next PACR compute a new output address."

[tensix.XMOV]
group = "unpack/pack"
desc = "Start the mover. An asynchronous copy or zero-fill in 16-byte units, set up in cfg.MOVER. It can zero an L1 region (to start an l1_acc accumulation) or copy L1 to L1 without a RISC loop."
notes = "Both operands are 0. Wait for it with STALLWAIT on Wait.XMOV. Copy and zero-fill are exact, at about 11 and 14 bytes per cycle (probed)."
[tensix.XMOV.fields]
block = "Keep 0."
last = "Keep 0."

[tensix.MVMUL]
group = "FPU"
lat = "5"
desc = "Matrix multiply-accumulate. Dst[8 x 16] += SrcB[8 x 16] @ SrcA[16 x 16]. A 32 x 32 tile product is a sequence of these. It always accumulates: ZEROACC the block first for a plain product."
notes = "Rows: SrcB is the 8 rows at RWC.SrcB & 0x38, SrcA the 16 rows at RWC.SrcA & 0x30. There is no Src row operand. Fidelity: each instruction multiplies at most 5 bits of SrcA by 7 bits of SrcB, chosen by the fidelity phase (the fidelity RWC plus THREAD.fidelity_phase; bit 0 picks the SrcA part, bit 1 the SrcB part). One pass per phase, 1 cycle each: phase 0 alone is the coarsest BF16 product, phases 0+1 are the usual choice, all four use every bit of both operands. Maximum error on random BF16 data in +-4 with 1 / 2 / 3 / 4 phases: 1.29 / 0.198 / 0.0088 / 0.0086 (probed). An SrcB of ones or small integers needs only phases 0+1. Summation: even with all phases the 16 products of a column are added aligned to the largest one, keeping about 12 bits below it. Terms of similar magnitude add exactly; terms 2^-8 .. 2^-11 of the largest can be off by up to 40%, and terms below about 2^-12 of it vanish (probed; the rounding rule is not modelled). Formats: the FPU works in the format the unpacker handed over with the SrcA bank, for both operands (probed for the elementwise ops). See cfg.MATH.srca_fmt."
[tensix.MVMUL.fields]
release = "Src banks to release afterwards: 1 SrcA, 2 SrcB, 3 both."
single_row = "0 normal. 1 uses a single SrcB row (RWC.SrcB & 0x3f) for the whole block and writes only Dst rows +0, +2, +4, +6; read the results from rows +0, +4 or +6."
addr_mod = "Address-modifier slot applied afterwards (0..7; only the low 3 bits are read)."
dst = "Dst row (10 bits), added to THREAD.dst_offset and the Dst RWC, then aligned down to 8. Keep bit 2 clear: with it set, rows 0..3 of the block are read raw even when ZEROACC'd."

[tensix.ELWADD]
group = "FPU"
lat = "5"
desc = "Elementwise add. Dst[8 x 16] = SrcA[8 x 16] + SrcB[8 x 16], or Dst += that."
notes = "Rows: SrcA is the 8 rows at RWC.SrcA & 0x38, SrcB the 8 rows at RWC.SrcB & 0x38. Needs fidelity phase 0. The format is the one handed over with the SrcA bank, for both operands (probed)."
[tensix.ELWADD.fields]
release = "Src banks to release afterwards: 1 SrcA, 2 SrcB, 3 both."
accumulate = "0 overwrites Dst, 1 adds the result to Dst."
broadcast = "SrcB broadcast (isa.Broadcast): 0 none, 1 column 0 to every column, 2 one row to all 8 rows, 3 one scalar."
addr_mod = "Address-modifier slot applied afterwards (0..7)."
dst = "Dst row (10 bits), added to THREAD.dst_offset and the Dst RWC, then aligned down to 8."

[tensix.ELWSUB]
group = "FPU"
lat = "5"
desc = "Elementwise subtract. Dst[8 x 16] = SrcA[8 x 16] - SrcB[8 x 16], or Dst += that. Fields, rows and rules as ELWADD."
fields_as = "ELWADD"

[tensix.ELWMUL]
group = "FPU"
lat = "5"
desc = "Elementwise multiply. Dst[8 x 16] += SrcA[8 x 16] * SrcB[8 x 16], one pass per fidelity phase as for MVMUL. Fields and rows as ELWADD."
fields_as = "ELWADD"
[tensix.ELWMUL.fields]
accumulate = "Ignored: ELWMUL always accumulates, Dst += SrcA * SrcB, with the bit 0 or 1 (probed). ZEROACC the block first for a plain product."

[tensix.GAPOOL]
group = "FPU"
lat = "5"
desc = "Four-row matrix multiply-accumulate. Dst[4 x 16] += SrcB[4 x 16] @ SrcA[16 x 16]: MVMUL with half the rows and half the throughput. With SrcB holding ones it sums the 16 SrcA rows of each column. The 4 Dst rows after the block are left alone (probed). Same dot-product datapath, precision and cost as MVMUL (probed): one instruction is one fidelity phase, and phase 0 alone sees 5 significant bits of SrcA and 7 of SrcB (1.9921875 * 3 gave 5.8125). Run 2 phases for an all-ones or small-integer SrcB, which is what a column sum needs, and 3 or 4 for arbitrary BF16 SrcB. The sum itself is then limited as described under MVMUL."
notes = "Rows: SrcB is the first 4 rows of the 8-row block at RWC.SrcB & 0x38, SrcA the 16 rows at RWC.SrcA & 0x30."
[tensix.GAPOOL.fields]
release = "Src banks to release afterwards: 1 SrcA, 2 SrcB, 3 both."
mode = "No effect, 0..7 (probed). The docs and tt-llk pass 1 (tt-llk: DIM_16X16)."
addr_mod = "Address-modifier slot applied afterwards (0..7, in bits 17:15)."
index = "Keep 0."
dst = "Dst row (10 bits), added to THREAD.dst_offset and the Dst RWC, then aligned down to 4."

[tensix.GMPOOL]
group = "FPU"
lat = "5"
desc = "Column-wise maximum. For each column, the maximum over the 16 SrcA rows at RWC.SrcA & 0x30, max'ed with one Dst row: Dst[r] = max(Dst[r], column max). The other three rows of that 4-row Dst block are written 0 (probed). No fidelity phases."
notes = "SrcB scales the input: SrcA row i is multiplied by 2^(exponent of SrcB[RWC.SrcB & 0x38][i]) (probed with powers of two), so fill that SrcB row with 1.0 for a plain maximum. A ZEROACC'd Dst row reads as -inf here, so no explicit initialisation is needed."
[tensix.GMPOOL.fields]
release = "Src banks to release afterwards: 1 SrcA, 2 SrcB, 3 both."
mode = "No effect (probed). The docs and tt-llk pass 1."
addr_mod = "Address-modifier slot applied afterwards (0..7, in bits 17:15)."
index = "Keep 0. There is no argmax on Blackhole: the maximum is still right, but no index is written (the low bits are 0 in a 32-bit Dst, untouched in a 16-bit one) (probed)."
dst = "Dst row (10 bits), added to THREAD.dst_offset and the Dst RWC, then aligned down to 4."

[tensix.MOVA2D]
group = "FPU"
lat = "4"
desc = "Move SrcA to Dst. Waits for the SrcA bank, then copies 1 row or an aligned 8 rows of 16 columns."
notes = "With cfg.MATH.fp32_dst_acc=1 the move writes 32-bit Dst datums. Use the 8-row form: the one-row form moves zeros for source rows 16..31 and 48..63, and is undefined with an odd addr_mod slot. The rows written must not be read for 3 cycles; the FPU stalls by itself, PACR and SFPLOAD need a STALLWAIT on Wait.MATH."
[tensix.MOVA2D.fields]
lo16 = "Keep 0. Writing only the low half of a 32-bit Dst datum corrupts data (TEN-4245)."
src = "SrcA row (6 bits), added to the SrcA RWC."
addr_mod = "Address-modifier slot applied afterwards (0..7)."
rows = "0 moves one row, 2 moves 8 rows."
dst = "Dst row (10 bits), added to THREAD.dst_offset and the Dst RWC."

[tensix.MOVB2D]
group = "FPU"
lat = "4"
desc = "Move SrcB to Dst. Waits for the SrcB bank, then copies rows of 16 columns, optionally broadcasting."
notes = "The 32-bit Dst write and the 3-cycle read rule are as MOVA2D."
[tensix.MOVB2D.fields]
lo16 = "Keep 0 (as MOVA2D)."
src = "SrcB row (6 bits), added to the SrcB RWC."
addr_mod = "Address-modifier slot applied afterwards (0..7)."
mode = "Flags: 4 moves an aligned 4 rows instead of one, 2 broadcasts one SrcB row to an aligned 8 Dst rows, 1 broadcasts column 0 to all 16 columns."
dst = "Dst row (10 bits), added to THREAD.dst_offset and the Dst RWC."

[tensix.MOVD2A]
group = "FPU"
lat = "2"
desc = "Move Dst to SrcA. Copies 1 row or an aligned 4 rows of 16 columns from Dst into the SrcA bank math owns, so a result can feed the next FPU instruction without a pack and unpack through L1."
notes = "FP32 and BF16 Dst data arrive in SrcA as BF16 (or TF32), in the format the unpacker last handed over with that bank unless cfg.THREAD.disable_implied_srca=1 selects cfg.MATH.srca_fmt. Sixteen 4-row moves from an FP32 Dst followed by ELWADD were exact with disable_implied_srca 0 and 1 (probed). It does not wait for the bank: STALLWAIT(Stall.MATH, Wait.SRCA_VLD) first, or it races the unpacker."
[tensix.MOVD2A.fields]
lo16 = "1 takes the low 16 bits of a 32-bit Dst datum. Normally 0."
src = "SrcA row written (6 bits), added to the SrcA RWC. Must be a multiple of 4 for a 4-row move."
addr_mod = "Address-modifier slot applied afterwards (0..7)."
rows = "0 moves one row, 2 moves 4 rows."
dst = "Dst row read (10 bits), added to THREAD.dst_offset and the Dst RWC."

[tensix.MOVD2B]
group = "FPU"
lat = "1"
desc = "Move Dst to SrcB. As MOVD2A, into the SrcB bank math owns; wait on Wait.SRCB_VLD. The conversion format is still chosen by the SrcA format settings. For 3 cycles afterwards the FPU accepts only another MOVD2B. Exact, like MOVD2A (probed). tt-llk issues GATESRCRST after it; that does nothing (see \"Not covered\")."
fields_as = "MOVD2A"

[tensix.MOVB2A]
group = "FPU"
lat = "4"
desc = "Move SrcB to SrcA. Waits for the SrcB bank (not SrcA), then copies 1 row or an aligned 4 rows."
notes = "A full 64-row copy is exact (probed). The docs list an erratum, SrcA rows first+4 .. first+7 of the same 16-row group coming out zeroed; 24 runs did not reproduce it (1-row and 4-row moves, with and without a STALLWAIT, right after an ELWADD). The docs also say it must not start exactly 3 cycles after an arithmetic instruction starts: STALLWAIT(Stall.MATH, Wait.MATH) first."
[tensix.MOVB2A.fields]
srca = "SrcA row written (6 bits), added to the SrcA RWC. Must be a multiple of 4 for a 4-row move."
addr_mod = "Address-modifier slot applied afterwards (0..7)."
rows = "0 moves one row, 2 moves 4 rows."
srcb = "SrcB row read (6 bits), added to the SrcB RWC."

[tensix.TRNSPSRCB]
group = "FPU"
lat = "1"
desc = "Transpose SrcB rows 16..31. Waits for the SrcB bank, then transposes in place the 16 x 16 block in rows 16..31 of the bank math owns; the other rows are untouched (probed). No operands. Nothing is needed after it before the FPU reads SrcB. The SrcB RWC fields are 4 bits, so reaching row 16 takes two INCRWC +8."

[tensix.ZEROACC]
group = "FPU"
lat = "1"
desc = "Mark Dst rows as zero. No data is written: the rows are flagged undefined, and from then on the FPU reads them as 0 (GMPOOL as -inf) and the packer reads them as 0."
notes = "The face index of mode 1 counts from the Dst half that THREAD.dst_offset points into, or from Dst row 0 when cfg.GLOBAL.zeroacc_abs_tile_mode=1 (probed). The SFPU must not SFPLOAD a row in this state, nor SFPSTORE into only some of its columns: store whole rows first. A ZEROACC in the same cycle as an SFPU or unpacker write to Dst wins, and that write's rows stay flagged."
[tensix.ZEROACC.fields]
mode = "0 one row, 1 one 16-row face, 2 half of Dst, 3 all of Dst. 4 and up are undefined."
fp32 = "1 when Dst holds 32-bit rows (cfg.MATH.fp32_dst_acc), 0 for 16-bit rows."
set_defined = "Keep 0. 1 does the opposite: it marks the rows defined again without writing them."
addr_mod = "Address-modifier slot applied afterwards (0..7), in modes 0 and 1 only."
where = "Mode 0: Dst row. Mode 1: face index. Mode 2: bit 0 picks the upper half. 10 bits are used."

[tensix.ZEROSRC]
group = "FPU"
lat = "1"
desc = "Clear Src banks. Sets all 64 rows of the selected SrcA / SrcB banks to 0."
notes = "It does not wait for the unpackers: STALLWAIT on Wait.UNPACK0 / Wait.UNPACK1 first. Src contents and pointers survive a kernel reload, so the probes issue it at start (probed)."
[tensix.ZEROSRC.fields]
neg_inf = "0 writes zeros. 1 writes negative infinity to SrcA instead."
math_bank = "Which single bank: 1 the one math owns, 0 the one the unpacker owns."
both_banks = "1 clears both banks and ignores math_bank."
srcs = "1 SrcA, 2 SrcB, 3 both."

[tensix.CLEARDVALID]
group = "FPU"
lat = "1"
desc = "Release Src banks to the unpackers. Hands the selected banks math owns back to the unpackers and switches math to the other bank of each."
notes = "With cfg.THREAD.disable_clr_dvalid_a/b set, the switch happens but the bank stays with math (probed)."
[tensix.CLEARDVALID.fields]
release = "1 SrcA, 2 SrcB, 3 both."
reset = "Bit 1: release the bank but keep reading it (no switch). Bit 0: reset the Src bank state. The docs call the reset unsupported (nondeterministic hangs); boot issues it once on an idle tile."

[tensix.SETRWC]
group = "FPU"
lat = "1"
desc = "Set math read/write counters. Sets the selected SrcA, SrcB and Dst row counters, optionally resets the fidelity phase, and optionally releases Src banks."
notes = "SFPU Dst addresses include the Dst RWC too: after FPU instructions that advance it, reset it before SFPLOAD or SFPSTORE, or they land that many rows off (probed)."
[tensix.SETRWC.fields]
release = "Src banks to release: 1 SrcA, 2 SrcB, 3 both (as CLEARDVALID)."
cr = "1 SrcA, 2 SrcB, 4 Dst: the value is added to that counter's carry/reset copy instead of replacing the counter. 8: for Dst, add to the current counter instead."
dst = "Dst value (4 bits)."
srcb = "SrcB value (4 bits)."
srca = "SrcA value (4 bits)."
mask = "Which to set: 1 SrcA, 2 SrcB, 4 Dst, 8 fidelity phase to 0. 15 with zero values resets all four. 16 sets the SFPU stack pointer instead, to (dst & 3) << 8 | srcb << 4 | srca."

[tensix.INCRWC]
group = "FPU"
lat = "1"
desc = "Increment math read/write counters. Advances the SrcA, SrcB and Dst row counters."
[tensix.INCRWC.fields]
cr = "1 SrcA, 2 SrcB, 4 Dst: increment that counter's carry/reset copy and reload the counter from it. With the bit clear only the counter itself advances."
dst = "Dst increment (4 bits)."
srcb = "SrcB increment (4 bits)."
srca = "SrcA increment (4 bits). A step of 16 or more takes several INCRWCs."

[tensix.SFPLOAD]
group = "SFPU"
desc = "Load Dst into an LReg. Reads 32 values from Dst, converting from the selected storage format."
notes = """
Lane n reads row (address & ~3) + n // 8, column 2 * (n % 8), plus 1 for the odd columns. The Dst RWC is part of the address: reset it (SETRWC) after FPU instructions that advance it (probed). Loading a row that ZEROACC flagged and nothing has written since is undefined.

Undetected RAW hazard after a 2-cycle (MAD-column) producer, so put one SFPNOP or unrelated instruction in between: HI16_ONLY / LO16_ONLY mode (14/15) into the register just written: corrupts the whole register, not only the preserved half.

Dst hand-off: after an FPU write to the same Dst rows, put 3 unrelated Tensix instructions or a STALLWAIT(Stall.SFPU, Wait.MATH) before SFPLOAD."""
regs = "reads R in the half-register modes (SFPLOADI 8 / 10, SFPLOAD 14 / 15), else none; stall logic sees none; writes R; load. A half load right after a 2-cycle write to R corrupts it."
[tensix.SFPLOAD.fields]
lreg = "Destination L0..L7. 8 and up load nothing and only apply the address modifier."
format = "Storage format (isa.SfpuFormat)."
addr_mod = "Address-modifier slot applied afterwards (0..7). It moves the RWCs but not the fidelity phase."
addr = "Dst address (10 bits), added to THREAD.dst_offset and the Dst RWC. Bits 9:2 pick an aligned group of 4 rows, bit 1 picks the odd columns, bit 0 is unused."

[tensix.SFPSTORE]
group = "SFPU"
desc = "Store an LReg into Dst. Writes the enabled lanes into Dst in the selected storage format. Fields, addressing and lane layout as SFPLOAD; lreg is the source and may be a constant register."
notes = """
FP32 and BF16 stores flush denormals to zero and BF16 / FP16 stores truncate. An FP32 store turns every value whose exponent field is 0 into +-0, which destroys small integers such as SFPLZ counts and SFPMUL24 products (probed): store integers and raw bits with SfpuFormat.INT32. An FP32 SFPLOAD is raw. A store marks all 4 rows of its group defined, including rows whose lanes are disabled: those then read as their old contents. So after ZEROACC, store whole rows (both column halves) before anything reads them.

An SFPSTORE within about 3 instructions after a PACR can overwrite rows that PACR has not read yet."""
regs = "reads R; stall logic sees R; writes none; store"
fields_as = "SFPLOAD"

[tensix.SFPLOADI]
group = "SFPU"
desc = "Load an immediate into an LReg. Broadcasts a 16-bit immediate to the enabled lanes."
notes = """
An exact FP32 or 32-bit constant is two instructions: UPPER then LOWER (or the reverse).

Undetected RAW hazard after a 2-cycle (MAD-column) producer, so put one SFPNOP or unrelated instruction in between: UPPER / LOWER mode (8/10) into the register just written: corrupts the whole register, not only the preserved half."""
regs = "reads R in the half-register modes (SFPLOADI 8 / 10, SFPLOAD 14 / 15), else none; stall logic sees none; writes R; load. A half load right after a 2-cycle write to R corrupts it."
[tensix.SFPLOADI.fields]
lreg = "Destination L0..L7."
mode = "isa.LoadImm: 0 BF16 bits into the high half (low half 0), 1 FP16 converted to FP32, 2 uint16 zero-extended, 4 int16 sign-extended, 8 replace the upper 16 bits, 10 replace the lower 16 bits."
imm = "The 16-bit pattern."

[tensix.SFPLOADMACRO]
group = "SFPU"
desc = "Load from Dst and launch a programmed sequence. Does an SFPLOAD, then runs up to one recorded instruction on each of the four other sub-units (simple, MAD, round, store) at programmed delays. This is the only way the SFPU runs more than one instruction per cycle."
notes = """
Programmed through SFPCONFIG:

```text
templates 0..3   one raw SFPU instruction word each (config_dest 0..3, or issue the instruction with
                 destination 12..15)
sequences 0..3   one byte per sub-unit: byte 0 simple, 1 MAD, 2 round, 3 store (config_dest 4..7). In a byte,
                 bits 2:0 = 0 nothing, 2 SFPNOP, 3 SFPSTORE, 4..7 template 0..3; bits 5:3 = delay (0 = the cycle
                 after the SFPLOADMACRO); bit 6 = use LReg.LOAD_MACRO as that instruction's destination (or as the
                 store's source); bit 7 = the loaded register replaces the template's VB instead of its VC (for a
                 store: keep the template's source).
control word     config_dest 8: bits 3:0 the store's format, bits 7:4 per sequence "store in the load's format",
                 bits 11:8 per sub-unit "delay counts SFPU instructions issued, not cycles".
```

See the scheduling notes above: nothing inside a sequence is stalled for you.

Inside a sequence none of the hazard rules apply: the delays are entirely the program's job, and a regular instruction that lands on a busy sub-unit is silently dropped."""
regs = "reads none; stall logic sees none; writes `(R & 3) | (bit 0 << 2)`; load"
[tensix.SFPLOADMACRO.fields]
lreg = "Sequence 0..3 in the high two bits, the low two bits of the destination LReg in the low two."
format = "Storage format of the load (isa.SfpuFormat)."
addr_mod = "Address-modifier slot applied after the load (0..7). A scheduled store does not apply one."
addr = "Dst address (10 bits) as SFPLOAD, except that bit 0 of the final address is bit 2 of the destination LReg. If the offsets added to it are odd, the destination is off by 4."

[tensix.SFPCONFIG]
group = "SFPU"
desc = "Write SFPU configuration. Sets a programmable constant, the lane configuration, or SFPLOADMACRO state. The value is lanes 0..7 of L0 (replicated to all 32 lanes) unless the immediate flag is set."
notes = """
A template is a 32-bit word, so it has to come from L0. The immediate reaches only the low 16 bits of a sequence (its simple and MAD bytes). Follow a change to SFPLOADMACRO state with an SFPNOP.

Undetected RAW hazard after a 2-cycle (MAD-column) producer, so put one SFPNOP or unrelated instruction in between: without immediate: the L0 read.

An SFPNOP must also follow an SFPCONFIG that changes DISABLE_BACKDOOR_LOAD. L12..L14 and LaneConfig.DISABLE_BACKDOOR_LOAD carry over across kernel launches (firmware resets only L11/ENCC)."""
regs = "reads none if mod & 1, else L0; stall logic sees none; writes VD if 11 <= VD < 15; the non-immediate L0 read is undetected"
[tensix.SFPCONFIG.fields]
imm = "Immediate value, with mode bit 0. With mode bit 3 it is a lane mask."
target = "0..3 SFPLOADMACRO template, 4..7 sequence, 8 macro control word, 11..14 the constant registers L11..L14, 15 lane configuration. 9 and 10 are undefined."
mode = "1 use the immediate. 2 / 4 / 6 OR / AND / XOR the value into the control word or the lane configuration instead of replacing it. 8 the immediate is a lane mask."

[tensix.SFPNOP]
group = "SFPU"
desc = "SFPU no-op. Occupies one SFPU cycle. Used for the dependency gaps the hardware does not insert by itself (see the scheduling notes above) and as filler in SFPLOADMACRO sequences."
regs = "reads ; stall logic sees ; writes ; load. Issues, but never stalls or hazards."

[tensix.SFPMAD]
group = "SFPU"
desc = "Multiply-add. VD = A * B + C in FP32. 2 cycles."
notes = "Not an IEEE fused multiply-add: the product is partly rounded before the add. Denormal inputs count as zero and denormal results flush to zero. Rounds to nearest even. The two indirect flags make the stall logic assume every register is read / written, which costs stalls."
regs = "reads VA, VB, VC, + L7 if mod & 12; stall logic sees all LRegs if mod & 4, else = reads; writes L0..L7 if mod & 8, else VD; lat 2, mad. mod 4 / 8 are the indirect A / VD-from-L7 flags."
[tensix.SFPMAD.fields]
a = "A (4 bits used)."
b = "B."
c = "C."
dest = "VD."
mode = "Flags: 1 negate A, 2 negate C, 4 take A's register number from the low 4 bits of L7 (per lane), 8 take the destination's register number from L7 the same way."

[tensix.SFPADD]
group = "SFPU"
desc = "Floating-point add. SFPMAD with A = LReg.ONE: VD = B + C. Pass a=LReg.ONE. Fields, flags and timing as SFPMAD; mode=2 gives B - C."
regs = "reads VA, VB, VC, + L7 if mod & 12; stall logic sees all LRegs if mod & 4, else = reads; writes L0..L7 if mod & 8, else VD; lat 2, mad. mod 4 / 8 are the indirect A / VD-from-L7 flags."
fields_as = "SFPMAD"

[tensix.SFPMUL]
group = "SFPU"
desc = "Floating-point multiply. SFPMAD with C = LReg.ZERO: VD = A * B. Pass c=LReg.ZERO. Fields, flags and timing as SFPMAD; mode=1 gives -(A * B)."
regs = "reads VA, VB, VC, + L7 if mod & 12; stall logic sees all LRegs if mod & 4, else = reads; writes L0..L7 if mod & 8, else VD; lat 2, mad. mod 4 / 8 are the indirect A / VD-from-L7 flags."
fields_as = "SFPMAD"

[tensix.SFPADDI]
group = "SFPU"
desc = "Add a BF16 immediate. VD = imm + VD, the immediate widened to FP32 (bits << 16). 2 cycles."
regs = "reads VD, + L7 if mod & 8; stall logic sees = reads; writes L0..L7 if mod & 8, else VD; lat 2, mad"
[tensix.SFPADDI.fields]
imm = "BF16 bit pattern."
dest = "Input and output register."
mode = "Flags: 2 negate the VD input (imm - VD), 8 destination register number from L7. 1 and 4 are reserved."

[tensix.SFPMULI]
group = "SFPU"
desc = "Multiply by a BF16 immediate. VD = imm * VD, the immediate widened to FP32 (bits << 16). 2 cycles. Saves the register and the SFPLOADI a constant multiply otherwise needs. Probed, including both flags."
regs = "reads VD, + L7 if mod & 8; stall logic sees = reads; writes L0..L7 if mod & 8, else VD; lat 2, mad"
[tensix.SFPMULI.fields]
imm = "BF16 bit pattern."
dest = "Input and output register."
mode = "Flags: 2 negate the VD input, 8 destination register number from L7. 1 and 4 are reserved."

[tensix.SFPMUL24]
group = "SFPU"
desc = "23-bit unsigned integer multiply. 2 cycles, timing as SFPMAD. Probed in both modes."
notes = "Store the result with SfpuFormat.INT32: an FP32 store zeroes values below 2^23."
regs = "reads VA, VB, VC, + L7 if mod & 12; stall logic sees all LRegs if mod & 4, else = reads; writes L0..L7 if mod & 8, else VD; lat 2, mad. mod 4 / 8 are the indirect A / VD-from-L7 flags."
[tensix.SFPMUL24.fields]
a = "A (4 bits used)."
b = "B."
c = "Must be LReg.ZERO."
dest = "VD."
mode = "0: VD = the low 23 bits of A * B. 1: VD = (low 23 bits of A) * (low 23 bits of B) >> 23, the high part of the 46-bit product. 4 / 8: A's / the destination's register number from L7."

[tensix.SFPLUT]
group = "SFPU"
desc = "Three-segment piecewise-linear function with 8-bit coefficients. VD = a * |L3| + b, the (a, b) pair chosen by |L3|: from L0 for [0, 1), L1 for [1, 2), L2 for 2 and up. 2 cycles, timing as SFPMAD. The multiply-add is fused (one rounding). Everything here matches hardware bit for bit, including both flags (probed)."
notes = "a is bits 15:8 and b bits 7:0 of the chosen register. Each is sign, 3-bit exponent, 4-bit mantissa: +-(1 + m / 16) * 2^-e, so magnitudes 0.0078 .. 1.9375, and 0xFF means 0. SFPLUTFP32 is the precise version."
regs = "reads L0..L3, + L7 if mod0 & 8; stall logic sees = reads; writes L0..L7 if mod0 & 8, else R; lat 2, mad"
[tensix.SFPLUT.fields]
lreg = "VD."
mode = "Flags: 4 give the result the sign of L3, 8 destination register number from L7."
addr = "Keep 0."

[tensix.SFPLUTFP32]
group = "SFPU"
desc = "Piecewise-linear function of |L3|. VD = slope * |L3| + intercept, the pair chosen by which segment |L3| falls in. One instruction replaces a compare / select / multiply-add chain. 2 cycles, timing as SFPMAD. The multiply-add is fused: one rounding, so within 1 ULP of a separately rounded multiply and add. Segment choice and coefficient decoding match this table in every lane for modes 0, 2, 3 and their signed forms 4 and 6 (probed)."
notes = "The 16-bit coefficients are FP16-like with a 10-bit mantissa, except that exponent 31 means 0.0 and exponent 0 is an ordinary exponent: encode zero with exponent 31."
regs = "reads L0..L6; stall logic sees all LRegs if bits[19:16] & 8, else all but L7; writes VD; lat 2, mad. seen_w is all LRegs with that bit."
[tensix.SFPLUTFP32.fields]
dest = "VD in the low 4 bits (word bits 7:4). Word bits 19:16 must repeat mode: the stall logic reads its copy there. So pass dest = VD | mode << 12."
mode = "Table layout in the low 2 bits, plus 4 = give the result the sign of L3: 0   3 segments [0,1) [1,2) [2,inf), FP32 coefficients: slopes in L0..L2, intercepts in L4..L6. 2   6 segments split at 0.5, 1, 1.5, 2, 3, 16-bit coefficients: slopes in the halves of L0..L2, intercepts in the halves of L4..L6; the low half is the lower segment. 3   as 2 with the last split at 4 instead of 3. 10  3 segments, 16-bit: slope in the high half and intercept in the low half of L0..L2. Erratum (probed): the result goes to the register named by the low 4 bits of L7, and VD is left unchanged."

[tensix.SFPARECIP]
group = "SFPU"
desc = "Approximate reciprocal or exponential. A coarse per-lane estimate, meant as the seed of a refinement."
notes = """
The reciprocal of 1.0 comes out as 0.99609375. Mode 2 on a negative input gives -exp(|x|), not exp(x): finish with a mode 1 reciprocal conditioned on the sign.

Undetected RAW hazard after a 2-cycle (MAD-column) producer, so put one SFPNOP or unrelated instruction in between: mode 1: the VB read."""
regs = "reads VC, VB if mod == 1, else VC; stall logic sees VC, VD if mod == 1, else VC; writes VD"
[tensix.SFPARECIP.fields]
imm = "VB for mode 1."
src = "VC, the input."
dest = "VD."
mode = "0: VD = about 1 / VC, sign kept. 1: the same on |VC|, but only in lanes where VB is negative. 2: about exp(|VC|) with VC's sign put back, usable for |VC| < 2."

[tensix.SFPMOV]
group = "SFPU"
desc = "Copy or negate. VD = VC."
regs = "reads VC; stall logic sees VC; writes VD"
[tensix.SFPMOV.fields]
src = "VC."
dest = "VD."
mode = "0 copy. 1 copy with bit 31 flipped (FP32 or sign-magnitude negate, not two's complement). 2 copy to every lane, ignoring the condition flags. 8 read special state selected by VC; VC=9 reads and advances the hardware PRNG."

[tensix.SFPABS]
group = "SFPU"
desc = "Absolute value. VD = |VC|."
notes = "FP32 mode leaves a negative NaN negative. Integer mode leaves -2^31 unchanged."
regs = "reads VC; stall logic sees VC; writes VD"
[tensix.SFPABS.fields]
src = "VC."
dest = "VD."
mode = "0 two's-complement integer, 1 FP32."

[tensix.SFPAND]
group = "SFPU"
desc = "Bitwise AND. VD = VD & VC, or VD = VB & VC."
notes = "Undetected RAW hazard after a 2-cycle (MAD-column) producer, so put one SFPNOP or unrelated instruction in between: with mode=1 (USE_VB): the VB read."
regs = "reads VC, + VB if mod & 1 else VD; stall logic sees VC, VD; writes VD; USE_VB's VB read is undetected"
[tensix.SFPAND.fields]
imm = "VB in the low 4 bits, with mode=1."
src = "VC."
dest = "VD."
mode = "0: the first input is VD. 1: the first input is VB."

[tensix.SFPOR]
group = "SFPU"
desc = "Bitwise OR. VD = VD | VC, or VD = VB | VC. Fields as SFPAND."
notes = "Undetected RAW hazard after a 2-cycle (MAD-column) producer, so put one SFPNOP or unrelated instruction in between: with mode=1 (USE_VB): the VB read."
regs = "reads VC, + VB if mod & 1 else VD; stall logic sees VC, VD; writes VD; USE_VB's VB read is undetected"
fields_as = "SFPAND"

[tensix.SFPXOR]
group = "SFPU"
desc = "Bitwise XOR. VD = VD ^ VC. There is no VB form: the destination is always the first input."
regs = "reads VC, VD; stall logic sees VC, VD; writes VD"
[tensix.SFPXOR.fields]
src = "VC."
dest = "VD."

[tensix.SFPNOT]
group = "SFPU"
desc = "Bitwise NOT. VD = ~VC, bit-exact for every pattern including infinities and NaNs (probed)."
regs = "reads VC; stall logic sees VC; writes VD"
[tensix.SFPNOT.fields]
src = "VC."
dest = "VD."

[tensix.SFPLZ]
group = "SFPU"
desc = "Count leading zeros. VD = number of leading zero bits of VC (32 for 0)."
notes = "All probed. Store the count with SfpuFormat.INT32: an FP32 store zeroes it."
regs = "reads VC; stall logic sees VC; writes VD"
[tensix.SFPLZ.fields]
src = "VC."
dest = "VD."
mode = "Flags: 4 clear bit 31 of VC first. 2 also set each lane's condition flag to \"VC != 0\". 8 invert that flag (2 | 8 gives \"VC == 0\")."

[tensix.SFPSHFT]
group = "SFPU"
desc = "Shift bits within each lane. A positive amount shifts left, a negative one shifts right."
notes = "Undetected RAW hazard after a 2-cycle (MAD-column) producer, so put one SFPNOP or unrelated instruction in between: register-shift form only (mode & 1 == 0; immediate forms are detected): the VD read."
regs = "reads VC if mod & 5 == 5; VD if mod & 1; else VC, VD; stall logic sees = reads if mod & 1, else VC; writes VD; the register-shift form's VD read is undetected"
[tensix.SFPSHFT.fields]
imm = "Signed shift amount, as amount & 0xFFF, with mode bit 0."
src = "VC: the shift amount in register mode, or the data with mode bit 2."
dest = "VD: the result, and the data unless mode bit 2 is set."
mode = "Flags: 1 shift by the immediate instead of by VC. 2 right shifts are arithmetic. 4 (with 1) shift VC into VD instead of shifting VD in place. So 0 is VD <<= VC, 1 is VD <<= imm, 5 is VD = VC >> imm logical and 7 the same arithmetic (the two ttrv uses)."

[tensix.SFPSHFT2]
group = "SFPU"
desc = "Move values between lanes, or shift bits."
notes = """
Modes 2, 3 and 4 take 2 cycles. ttrv reduces across lanes with mode 3, SFPADD and SFPTRANSP.

Undetected RAW hazard after a 2-cycle (MAD-column) producer, so put one SFPNOP or unrelated instruction in between: modes 2..4 (VC, plus L1..L3 for mode 2) and modes 5..6 (VB)."""
regs = """
mode 0: reads L1..L3, VC; stall logic sees = reads; writes L0..L3; round
mode 1: reads L0..L3, VC; stall logic sees = reads; writes L0..L3; round
mode 2: reads L1..L3, VC; stall logic sees none; writes L0..L3; round, block
mode 3, 4: reads VC; stall logic sees none; writes VD; round, block
mode 5: reads VB, VC; stall logic sees VC, VD; writes VD; round
mode 6: reads VB; stall logic sees VD; writes VD; round"""
[tensix.SFPSHFT2.fields]
imm = "VB, or a signed 12-bit shift amount, depending on the mode."
src = "VC."
dest = "VD."
mode = "0 copy L1..L3 down into L0..L2 whole. 1 the same as a chained copy. 2 rotate and copy. 3 rotate right by one lane within each row of 8 (lane 7 wraps to lane 0). 4 shift right by one lane within each row, zero fill. 5 shift bits by a register amount. 6 shift bits by the immediate."

[tensix.SFPIADD]
group = "SFPU"
desc = "Integer add or subtract. 32-bit two's-complement arithmetic on the register bits."
notes = "Undetected RAW hazard after a 2-cycle (MAD-column) producer, so put one SFPNOP or unrelated instruction in between: register forms (mode & 1 == 0): the VD read."
regs = "reads VC if mod & 1, else VC, VD; stall logic sees VC; writes VD; the register form's VD read is undetected"
[tensix.SFPIADD.fields]
imm = "Signed immediate, as value & 0xFFF, with mode bit 0."
src = "VC."
dest = "VD, also the second input in the register forms."
mode = "Low 2 bits: 0 VD = VC + VD, 1 VD = VC + imm, 2 VD = VC - VD. Without 4, each lane's condition flag is set to \"result is negative\"; 8 inverts that. 4 leaves the flags alone."

[tensix.SFPCAST]
group = "SFPU"
desc = "Convert integers."
notes = "The SFPU's float-to-int and int-to-float paths use sign-magnitude integers; SFPIADD and the shifts use two's complement. Convert with mode 3 when crossing."
regs = "reads VC; stall logic sees VC; writes VD"
[tensix.SFPCAST.fields]
src = "VC (4 bits used)."
dest = "VD."
mode = "0 sign-magnitude int32 to FP32, round to nearest even. 1 the same with stochastic rounding. 2 two's-complement absolute value (prefer SFPABS). 3 convert between two's complement and sign-magnitude."

[tensix.SFP_STOCH_RND]
group = "SFPU"
desc = "Round to a narrower format. VD = VC reduced in precision or converted to a small integer."
notes = "Integer results are sign-magnitude and saturate (255, +-127, 65535, +-32767). Float forms turn NaN into infinity and denormals and -0 into +0. Errata: stochastic mode is biased upward and can change values that were already exact. Toward-zero rounds away when every discarded bit is 1. Float to int with |x| < 0.5 always gives 0."
regs = "reads VC, + VB if mod & 7 in (4, 5) and not mod & 8; stall logic sees VC, + VB unless mod & 8; writes VD; round"
[tensix.SFP_STOCH_RND.fields]
rounding = "0 nearest (ties away from zero), 1 stochastic, 2 toward zero."
imm = "Right-shift amount for the int-to-int forms, with mode bit 3."
b = "VB: the shift amount otherwise. For the float forms pass LReg.ZERO, or the stall logic waits on whatever register number is here."
src = "VC."
dest = "VD."
mode = "Low 3 bits: 0 FP32 to FP16 precision, 1 FP32 to BF16 precision (the result stays an FP32 value with the low mantissa bits cleared), 2 FP32 to uint8, 3 FP32 to int8, 6 FP32 to uint16, 7 FP32 to int16, 4 int32 to uint8, 5 int32 to int8. Bit 3: shift by the immediate."

[tensix.SFPEXEXP]
group = "SFPU"
desc = "Extract the exponent. VD = the FP32 exponent field of VC as an integer."
regs = "reads VC; stall logic sees VC; writes VD"
[tensix.SFPEXEXP.fields]
src = "VC."
dest = "VD."
mode = "0 exponent minus 127. 1 the raw biased exponent. 2 also set each lane's condition flag from the sign of the result. 8 invert that flag."

[tensix.SFPEXMAN]
group = "SFPU"
desc = "Extract the mantissa. VD = the 23 mantissa bits of VC as an integer; the top 8 bits are 0."
regs = "reads VC; stall logic sees VC; writes VD"
[tensix.SFPEXMAN.fields]
src = "VC."
dest = "VD."
mode = "0 sets bit 23 (the hidden leading 1). 1 leaves it 0."

[tensix.SFPSETEXP]
group = "SFPU"
desc = "Replace the exponent. VD = VC with a new exponent field; sign and mantissa of VC are kept."
notes = "Undetected RAW hazard after a 2-cycle (MAD-column) producer, so put one SFPNOP or unrelated instruction in between: without the immediate flag: the VD read."
regs = "reads VC if mod & 1, else VC, VD; stall logic sees VC, VD if mod & 1, else VC; writes VD; the non-immediate form's VD read is undetected"
[tensix.SFPSETEXP.fields]
imm = "Biased exponent (8 bits), with mode=1."
src = "VC."
dest = "VD."
mode = "1 exponent from the immediate. 0 from the low 8 bits of the old VD. 2 from the exponent field of the old VD."

[tensix.SFPSETMAN]
group = "SFPU"
desc = "Replace the mantissa. VD = VC with a new mantissa; sign and exponent of VC are kept."
notes = "Undetected RAW hazard after a 2-cycle (MAD-column) producer, so put one SFPNOP or unrelated instruction in between: without the immediate flag: the VD read."
regs = "reads VC if mod & 1, else VC, VD; stall logic sees VC, VD if mod & 1, else VC; writes VD; the non-immediate form's VD read is undetected"
[tensix.SFPSETMAN.fields]
imm = "With mode=1: the mantissa is this immediate << 11."
src = "VC."
dest = "VD."
mode = "1 mantissa from the immediate. 0 from the low 23 bits of the old VD. Both probed."

[tensix.SFPSETSGN]
group = "SFPU"
desc = "Replace the sign. VD = VC with a new sign bit; exponent and mantissa of VC are kept."
notes = "Undetected RAW hazard after a 2-cycle (MAD-column) producer, so put one SFPNOP or unrelated instruction in between: without the immediate flag: the VD read."
regs = "reads VC if mod & 1, else VC, VD; stall logic sees VC, VD if mod & 1, else VC; writes VD; the non-immediate form's VD read is undetected"
[tensix.SFPSETSGN.fields]
imm = "The sign bit in bit 0, with mode=1."
src = "VC."
dest = "VD."
mode = "1 sign from the immediate. 0 from the sign of the old VD (copysign)."

[tensix.SFPDIVP2]
group = "SFPU"
desc = "Scale by a power of two. VD = VC with its exponent field changed. 1 cycle and no constant register, against 2 cycles and a constant for a multiply."
notes = "All probed. The add does not treat 0.0 specially: 0 scaled by 2^n comes out as 2^(n - 127), not 0 (0.0 with 128 gives 2.0), so guard zeros. A result whose exponent field wraps to 0 reads back as 0."
regs = "reads VC; stall logic sees VC; writes VD"
[tensix.SFPDIVP2.fields]
imm = "8-bit exponent value."
src = "VC."
dest = "VD."
mode = "1: add the immediate to the exponent field, wrapping at 8 bits (2^n scaling; use 256 - n to divide). Infinity and NaN pass through. 0: replace the exponent field with the immediate."

[tensix.SFPSWAP]
group = "SFPU"
desc = "Swap, or minimum and maximum together. Both registers are written. 2 cycles."
notes = """
The order is the sign-magnitude integer order, which for FP32 is a total order: -NaN < -inf < ... < -0 < +0 < ... < +inf < +NaN. With destination-index tracking on in the lane configuration, the same swaps are applied to L4..L7, which is how argmin / argmax is built.

Undetected RAW hazard after a 2-cycle (MAD-column) producer, so put one SFPNOP or unrelated instruction in between: modes != 0 (mode 0 is safe): the VC/VD compare read.

It ignores writes to VC >= 8, so only VD must be < 8."""
regs = "reads none if mod == 0, else VC, VD; stall logic sees none; writes VC, VD; block. The compare reads of modes != 0 are undetected."
[tensix.SFPSWAP.fields]
src = "VC."
dest = "VD."
mode = "0 swap. 1 VD = min, VC = max in every lane. 9 VD = max, VC = min. 2..8 do min/max with the placement varying by row of 8 lanes: 2 rows 0,1 get min in VD; 3 rows 0,2; 4 rows 0,3; 5, 6, 7, 8 only row 0, 1, 2, 3."

[tensix.SFPTRANSP]
group = "SFPU"
desc = "Transpose registers against lane rows. Row j of L[i] is exchanged with row i of L[j], for L0..L3 and separately for L4..L7. Each 8-lane row moves whole; the 8 columns are not touched. All operands 0."
regs = "reads L0..L7; stall logic sees L0..L7; writes L0..L7"
[tensix.SFPTRANSP.fields]
imm = "Keep 0."
src = "Keep 0."
dest = "Keep 0."
mode = "Keep 0."

[tensix.SFPENCC]
group = "SFPU"
desc = "Turn predication on or off. Controls whether the per-lane condition flags gate later SFPU writes, and sets the flags."
notes = "ttrv opens a conditional with SFPENCC(1, 0, 0, 2) and closes it with SFPENCC(0, 0, 0, 2). Boot issues SFPENCC(3, 0, 0, 10)."
regs = "reads none; stall logic sees none; writes none"
[tensix.SFPENCC.fields]
imm = "Bit 0: the new predication enable, with mode = 2. Bit 1: the new flag value, with 8."
mode = "1 toggle predication. 2 set predication from immediate bit 0. 8 set every flag to immediate bit 1; without 8 every flag becomes true."

[tensix.SFPSETCC]
group = "SFPU"
desc = "Set the condition flags from a register. Each lane's flag becomes a test of VC."
regs = "reads VC; stall logic sees VC; writes none"
[tensix.SFPSETCC.fields]
imm = "Bit 0: the flag value, with mode = 1."
src = "VC."
mode = "0 VC < 0. 2 VC != 0. 4 VC >= 0. 6 VC == 0. 1 the immediate. 8 clear the flags."

[tensix.SFPGT]
group = "SFPU"
desc = "Compare greater-than. Tests VD > VC per lane, in the sign-magnitude / FP32 total order (see SFPSWAP)."
notes = "Blackhole only. ttrv uses mode 1."
regs = "reads VC, VD; stall logic sees VC, VD; writes VD if mod & 8"
[tensix.SFPGT.fields]
src = "VC."
dest = "VD."
mode = "Flags: 1 set each lane's condition flag to the result. 8 write the result into VD as 0xFFFFFFFF or 0. 2 AND the result into the flags on top of the predicate stack; 2 | 4 OR it in instead."

[tensix.SFPLE]
group = "SFPU"
desc = "Compare less-or-equal. Tests VD <= VC per lane. Fields and modes as SFPGT."
regs = "reads VC, VD; stall logic sees VC, VD; writes VD if mod & 8"
fields_as = "SFPGT"

[tensix.SFPPUSHC]
group = "SFPU"
desc = "Push the predicate state. Saves the condition flags and the predication enable on the 8-entry predicate stack, for a nested conditional. All operands 0."
regs = "reads none; stall logic sees none; writes none"
[tensix.SFPPUSHC.fields]
imm = "Keep 0."
src = "Keep 0."
dest = "Keep 0."
mode = "Keep 0."

[tensix.SFPPOPC]
group = "SFPU"
desc = "Pop the predicate state."
notes = "Popping an empty stack is an error."
regs = "reads none; stall logic sees none; writes none"
[tensix.SFPPOPC.fields]
mode = "0 pop: restore the flags and the predication enable. 1..12 leave the stack alone and combine the flags with the ones on top of it. 13 invert the flags. 14 / 15 enable predication with all flags true / false."

[tensix.SFPCOMPC]
group = "SFPU"
desc = "Else. Each lane's condition flag becomes \"the enclosing condition holds and this one did not\": the flags on top of the predicate stack AND NOT the current flags. With an empty stack it is a plain inversion. All operands 0."
regs = "reads none; stall logic sees none; writes none"
[tensix.SFPCOMPC.fields]
imm = "Keep 0."
src = "Keep 0."
dest = "Keep 0."
mode = "Keep 0."
[cfg]
"THREAD.cfg_bank" = "which of the two shared Config banks this thread reads (0 or 1)"
"THREAD.dst_offset" = "Dst row offset added to every FPU and SFPU Dst address (picks the Dst half)"
"THREAD.disable_implied_srca" = "0: the FPU uses the SrcA format the unpacker handed over with the bank, and `MATH.srca_fmt` is ignored. 1: the FPU uses `MATH.srca_fmt` instead."
"THREAD.sfpu_dst_fmt_en" = "1 = SFPLOAD/SFPSTORE in DEFAULT mode use `sfpu_dst_fmt` (ttrv always sets it)"
"THREAD.sfpu_dst_fmt" = "SFPU Dst DataFormat when `sfpu_dst_fmt_en=1`"
"THREAD.srca_override_addr" = "1: unpacker 0 takes its SrcA row from the output address (row & 63). Every unpack to SrcA needs this; with 0 it comes out corrupted. 0: the row comes from the SrcRow counter, which an unpack straight to Dst needs. So it is 1 by default and toggled to 0 around each unpack to Dst."
"THREAD.disable_clr_dvalid_a" = "1: a clear-dvalid of SrcA still flips the bank but leaves it with math, so later passes reuse the same data without waiting (98 vs ~46k cycles). The unpacker then blocks on that bank until it is really released."
"THREAD.disable_clr_dvalid_b" = "the same for SrcB"
"THREAD.fidelity_phase" = "fidelity phase added to the FPU's fidelity counter (0..3)"
"THREAD.unpack_ctx_offset[i]" = "per unpacker: added to the config context an UNPACR selects"
"THREAD.unpack_ctx_reset[i]" = "per unpacker: pulse to reset the context counter to 0 (also `unpack[i].context_reset`)"
"THREAD.unpack_ctx_inc[i]" = "per unpacker: increment the context counter"
"THREAD.addr_mod[s].srca_incr" = "SrcA RWC increment applied after the instruction"
"THREAD.addr_mod[s].srca_cr" = "1 = add the increment to the SrcA RWC's carry/reset copy and reload the counter from it (as INCRWC cr)"
"THREAD.addr_mod[s].srca_clear" = "1 = reset the SrcA RWC to 0"
"THREAD.addr_mod[s].srcb_incr" = "SrcB RWC increment"
"THREAD.addr_mod[s].srcb_cr" = "1 = the same for SrcB"
"THREAD.addr_mod[s].srcb_clear" = "1 = reset the SrcB RWC to 0"
"THREAD.addr_mod[s].dst_incr" = "Dst RWC increment"
"THREAD.addr_mod[s].dst_cr" = "1 = the same for Dst"
"THREAD.addr_mod[s].dst_clear" = "1 = reset the Dst RWC to 0"
"THREAD.addr_mod[s].dst_c_to_cr" = "copy the Dst RWC into its carry/reset copy (meaning taken from the name; not probed)"
"THREAD.addr_mod[s].fidelity_incr" = "fidelity phase increment"
"THREAD.addr_mod[s].fidelity_clear" = "1 = reset the fidelity phase to 0"
"THREAD.pack_addr_mod[s].ysrc_incr" = "channel 0 (Dst rows read) Y increment"
"THREAD.pack_addr_mod[s].ysrc_cr" = "1 = add it to the channel-0 Y CR copy and reload Y from it"
"THREAD.pack_addr_mod[s].ysrc_clear" = "1 = reset channel-0 Y"
"THREAD.pack_addr_mod[s].ydst_incr" = "channel 1 (L1 output) Y increment"
"THREAD.pack_addr_mod[s].ydst_cr" = "1 = add it to the channel-1 Y CR copy and reload Y from it"
"THREAD.pack_addr_mod[s].ydst_clear" = "1 = reset channel-1 Y"
"THREAD.pack_addr_mod[s].zsrc_incr" = "channel 0 Z increment"
"THREAD.pack_addr_mod[s].zsrc_clear" = "1 = reset channel-0 Z"
"THREAD.pack_addr_mod[s].zdst_incr" = "channel 1 Z increment (1 steps the output by l1_z_stride)"
"THREAD.pack_addr_mod[s].zdst_clear" = "1 = reset channel-1 Z (returns the output to the base)"
"MATH.srca_fmt" = "SrcA DataFormat for the FPU. Read only when `THREAD.disable_implied_srca=1`; otherwise the FPU takes the format the unpacker handed over, for both operands."
"MATH.srcb_fmt" = "The FPU ignores this (it follows SrcA). It only picks FP16 vs BF16 decoding for SFPLOAD in DEFAULT mode when `sfpu_fp32_acc` and `sfpu_dst_fmt_en` are both 0."
"MATH.dst_fmt" = "Dst accumulator DataFormat (FLOAT32 or FLOAT16_B)"
"MATH.fp32_dst_acc" = "1 = the FPU accumulates into 32-bit Dst rows (8 tiles per Dst half)"
"MATH.sfpu_fp32_acc" = "1 = the SFPU reads and writes 32-bit Dst rows"
"MATH.relu_mode" = "ReLU, applied by the packer to the datums it reads (Dst itself is not changed). 0 off, 1 max(x, 0), 2 zero where x <= threshold, 3 min(x, threshold). The register field is 4 bits wide ([5:2]) but only these low 2 bits are read."
"MATH.relu_threshold" = "threshold as 16 bits in the packer's `in_fmt`: a BF16 pattern for in_fmt FLOAT16_B and FLOAT32, an FP16 pattern for FLOAT16 (where one mode-2 run gave NaNs, unexplained; we do not use FP16)"
"MATH.state_reset" = "Any MMIO write to this word, whatever the value, instantly zeroes words 0..179 of that Config bank (180+ and the other bank are kept). Boot uses it. An RMWCIB to the word just stores the bit and resets nothing."
"UNPACK[i].in_fmt" = "TileDescriptor (THCON REG0, 128-bit). L1 source DataFormat"
"UNPACK[i].uncompressed" = "1 = the tile has no zero-compression. Read only by single-context UNPACRs; with contexts enabled `disable_zero_compress[ctx]` decides. 0 on plain data hangs."
"UNPACK[i].x_dim" = "datums per row of a face (typically 16, or 1024 for a flat unpack)"
"UNPACK[i].y_dim" = "rows per face (typically 16 or 1)"
"UNPACK[i].z_dim" = "faces per tile (1..4)"
"UNPACK[i].w_dim" = "tiles (typically 1)"
"UNPACK[i].out_fmt" = "THCON REG2. SrcA/SrcB (or Dst) output DataFormat"
"UNPACK[i].lf8_e4m3" = "1 = LF8 input is E4M3 (4-bit exponent), 0 = E5M2"
"UNPACK[i].transpose" = "1 = free X/Y face transpose (haloize_mode, unpacker 0 only)"
"UNPACK[i].tileize_mode" = "1 = gather rows of 32 datums from row-major L1 data, one row every `tileize_row_pitch`. Not a full tilizer: the rows still arrive in row-major order, so the four faces need reordering. Measured for inputs 32/64/96 wide."
"UNPACK[i].tileize_row_pitch" = "L1 distance between gathered rows, in 16-byte units (input width * datum bytes / 16; 8, 16 and 24 measured). cfg_defines.h names these 12 bits as three 4-bit `Shift_amount_cntx` fields, but they are one number, not per-context values."
"UNPACK[i].override_fmt" = "1 = use the per-context formats in REG7 instead of REG0/REG2"
"UNPACK[i].force_shared_exp" = "1 = replace the BFP shared exponent with `shared_exp`"
"UNPACK[i].shared_exp" = "8-bit forced shared exponent (word 50 for unpacker 0, 62 for unpacker 1)"
"UNPACK[i].add_dst_addr_cntr" = "1 = add the ADC counter to the Dst target (used for unpack-to-Dst)"
"UNPACK[i].row_stride" = "UNP{0,1}_ADDR_CTRL REG_1_Ystride: Src/Dst Y stride in bytes. The L1 side has no strides: the read position is the datum index the channel-0 ADC counters give (see `isa.UNPACR`)."
"UNPACK[i].face_stride" = "REG_1_Zstride: Src/Dst Z stride in bytes"
"UNPACK[i].context_count" = "active contexts - 1 (when `context_count_en=1`)"
"UNPACK[i].context_count_en" = "1 = enable context_count"
"UNPACK[i].disable_zero_compress[c]" = "per context 0..7: 1 = plain data. 0 on plain data hangs."
"UNPACK[i].unpack_to_dst[c]" = "per context 0..7: 1 = route unpacker 0 directly to FP32 Dst"
"UNPACK[i].context_in_fmt[c]" = "per context: override the L1 input format"
"UNPACK[i].context_out_fmt[c]" = "per context: override the Src/Dst output format"
"UNPACK[i].base_addr[c]" = "per context: L1 address in 16-byte words, minus 1"
"UNPACK[i].offset_addr[c]" = "4 x 16 bits (contexts 0..3, or 0..1 on unpacker 1), added to `base_addr` in 16-byte words. Context c uses entry c & 3. Two RMWCIBs between tiles move the read position with no stall (BF16 and BFP8; 4 BFP8 tiles in 621 cycles against 708 with a base rewrite per tile). Reading consecutive tiles without rewriting base_addr: step offset_addr (any format), or let the channel-0 Z counter run past z_dim (BF16 only; see UNPACR)."
"UNPACK[i].dst_addr[c]" = "per context 0..3: target row offset (unpacker 0)"
"UNPACK[i].tile_x_dim[c]" = "per context 0..3: per-context X dim (unpacker 0)"
"PACK.ctx[c].exp_section_size" = "BFP shared-exponent section size in 16-byte words (0 for BF16/FP32)"
"PACK.ctx[c].l1_dest_addr" = "L1 destination address in 16-byte words, minus 1 (usually written with WRCFG)"
"PACK.ctx[c].disable_zero_compress" = "1 = disable zero compression (always 1 for dense tiles)"
"PACK.ctx[c].out_fmt" = "L1 output DataFormat"
"PACK.ctx[c].in_fmt" = "the packer's intermediate DataFormat: Dst is first converted to in_fmt, then to out_fmt. FP32 Dst packed to BF16 truncates with in_fmt=FLOAT32 (what ttrv does) and rounds to nearest (ties away from zero) with in_fmt=FLOAT16_B, at no cost."
"PACK.ctx[c].l1_acc" = "1 = add each datum to what L1 already holds, after format conversion: FP32 is bit-exact, BF16 gives bf16(L1) + bf16(datum) rounded to nearest even. It can stay set across packs (three packs gave y + 3x exactly). Not for BFP output."
"PACK.ctx[c].downsample_mask" = "of every 16 datums, keep the ones whose bit is set and write them back to back. 0 and 0xFFFF both keep everything."
"PACK.ctx[c].pack_per_xy_plane" = "datums per XY plane (0 = full 16x16 face)"
"PACK.ctx[c].pack_reads_per_xy_plane" = "Dst row reads per XY plane (16 for a full face)"
"PACK.ctx[c].pack_xys_per_tile" = "XY faces per tile"
"PACK.ctx[c].dst_target_offset" = "Dst row the packer starts reading at. `THREAD.dst_offset` and the other math-side Dst offsets do not apply to the packer."
"PACK.lf8_e4m3" = "1 = LF8 output is E4M3 (4-bit exponent), 0 = E5M2"
"PACK.read_32b" = "1 = read 32-bit FP32/INT32 from Dst"
"PACK.y_stride" = "Dst bytes per row of the packer's Dst ADC"
"PACK.z_stride" = "Dst bytes per face"
"PACK.w_stride" = "Dst bytes per tile"
"PACK.l1_y_stride" = "L1 bytes (multiples of 16) the output address moves per Y step of the L1 ADC (see below). The output address is (l1_dest_addr + 1) * 16 + Y * l1_y_stride + Z * l1_z_stride + W * l1_w_stride. The strides are read only when a PACR starts a new address (the first PACR after one with Last=1); inside a stream they are ignored."
"PACK.l1_z_stride" = "L1 bytes (multiples of 16) the output address moves per Z step of the L1 ADC. Self-advance (measured): write l1_dest_addr once, set l1_z_stride to the tile's L1 size (4096 FP32, 2048 BF16, 1088 BFP8) and give the tile's Last PACR a pack_addr_mod slot with ydst_clear and zdst_incr=1. Output is exact (byte-identical to ttrv for BFP8). Per tile from a MOP, against rewriting the address: FP32 76 -> 50 cycles, BF16 66 -> 34..39, BFP8 78 -> 51. Stepping Y instead (ydst_cr + ydst_incr=1, l1_y_stride = tile size) works the same; INCADCZW / INCADCXY step the same counters from the instruction stream."
"PACK.l1_w_stride" = "L1 bytes (multiples of 16) the output address moves per W step of the L1 ADC"
"PACK.edge_mask[s]" = "4 x 16-bit keep masks, bit = column (0xFFFF keeps all 16 datums). A masked datum is still written to L1, as 0 or -inf. A row's mask is edge_mask[row_set_mapping[b][row]], where b is this context's row_set_select, or face_set_mapping[face_set_select][face] when face_set_en=1 (tt-isa-documentation Packers/EdgeMasking.md)."
"PACK.edge_mode" = "what a masked datum becomes: 0 = 0.0, 1 = -inf"
"PACK.row_set_mapping[s]" = "4 x 32 bits: 2 bits per row 0..15, naming the `edge_mask` for that row"
"PACK.row_set_select" = "2 bits per PACR context: which `row_set_mapping` applies"
"PACK.face_set_mapping[s]" = "4 x 32 bits: 2 bits per face 0..15, naming the `row_set_mapping`"
"PACK.face_set_select" = "2 bits per PACR context: which `face_set_mapping` applies"
"PACK.face_set_en" = "1 = choose the row mapping per face; `row_set_select` is then ignored"
"GLOBAL.icache_invalidate" = "5-bit mask: bit 0 BRISC, bits 1..3 TRISC0..2, bit 4 NCRISC"
"GLOBAL.prefetch_trisc" = "3-bit mask enabling TRISC0..2 instruction prefetch"
"GLOBAL.prefetch_brisc" = "enable BRISC instruction prefetch"
"GLOBAL.prefetch_ncrisc" = "enable NCRISC instruction prefetch"
"GLOBAL.prefetch_max_req" = "max outstanding instruction prefetch requests (boot sets 0x11F for the whole word)"
"GLOBAL.scratch[i]" = "3 free 32-bit words. CFGSHIFTMASK adds / ORs one into another Config word in the instruction stream, which is how a REPLAY body steps an address (measured). Its `scratch_sel=3` reads `scratch[TRISC number]`. Never make a scratch word the target of a CFGSHIFTMASK."
"GLOBAL.zeroacc_abs_tile_mode" = "0: ZEROACC's face index counts from the Dst half `THREAD.dst_offset` points into. 1: it counts from Dst row 0."
"MOVER.src_addr" = "L1 source address in 16-byte units"
"MOVER.dst_addr" = "destination address in 16-byte units"
"MOVER.size" = "length in 16-byte units (16 bits are read). Copy and zero-fill are exact with no overrun: a 64 KB copy runs at 11.3 bytes per cycle and a zero-fill at 14.1 (10.2 and 13.1 for 4 KB)."
"MOVER.direction" = "0 = zero-fill L1, 3 = L1 to L1 (both measured). 1 and 2 target config / NCRISC code memory and are not for us."

[enum.Stall]
_ = "STALLWAIT/SEMWAIT stall: which classes of this thread's later instructions are held back"
TDMA = "TDMA instructions"
SYNC = "sync instructions"
PACK = "pack instructions"
UNPACK = "unpack instructions"
XMOV = "mover instructions"
THCON = "scalar-unit instructions"
MATH = "FPU instructions"
CFG = "config instructions"
SFPU = "SFPU instructions"
THREAD = "all of the above"

[enum.Wait]
_ = "STALLWAIT wait: conditions waited for (all must clear). Blackhole numbering; the shared Wormhole pages of tt-isa-documentation quote Wormhole's, which differs."
THCON = "the scalar unit is busy or has memory requests outstanding (needed between a GPR write and its WRCFG)"
UNPACK0 = "unpacker 0's pipeline is busy"
UNPACK1 = "unpacker 1's pipeline is busy"
PACK0 = "the packer's pipeline is busy"
MATH = "the FPU's pipeline is busy"
